services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: taskboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:devpassword@db:5432/taskboard
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
