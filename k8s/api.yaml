apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      containers:
        - name: api
          image: ghcr.io/tamezza/taskboard:latest
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskboard-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://taskboard:$(DB_PASSWORD)@db:5432/taskboard
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskboard-db
                  key: secret-key
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
spec:
  selector:
    app: taskboard
  ports:
    - port: 80
      targetPort: 8000