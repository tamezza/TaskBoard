server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same rule as the Vite dev proxy: /api/boards -> http://api:8000/boards
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # Everything else is the React application
    location / {
        try_files $uri /index.html;
    }
}
