name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit identifier of the version to deploy (40 characters)
        required: true

permissions:
  id-token: write
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    env:
      RESOURCE_GROUP: taskboard-app-rg
      TAG: ${{ inputs.image_tag }}
    steps:
      - name: Check the identifier looks like a commit
        run: |
          if ! echo "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Not a 40-character commit identifier: $TAG"
            exit 1
          fi

      - name: Log in to Azure without a password
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Point the migration job at the new version
        run: >
          az containerapp job update --name taskboard-migrate
          --resource-group "$RESOURCE_GROUP"
          --image "ghcr.io/tamezza/taskboard:$TAG" --output none

      - name: Run the migrations and wait for the result
        run: |
          execution=$(az containerapp job start --name taskboard-migrate \
            --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          echo "Started $execution"
          for attempt in $(seq 1 30); do
            status=$(az containerapp job execution show --name taskboard-migrate \
              --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" \
              --query properties.status --output tsv)
            echo "Attempt $attempt: $status"
            if [ "$status" = "Succeeded" ]; then exit 0; fi
            if [ "$status" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          echo "The migration did not finish in 5 minutes"
          exit 1

      - name: Switch the API to the new version
        run: >
          az containerapp update --name taskboard-api
          --resource-group "$RESOURCE_GROUP"
          --image "ghcr.io/tamezza/taskboard:$TAG" --output none

      - name: Switch the interface to the new version
        run: >
          az containerapp update --name taskboard-web
          --resource-group "$RESOURCE_GROUP"
          --image "ghcr.io/tamezza/taskboard-web:$TAG" --output none

